[project]
name = "contest-check-ai"
version = "0.1.0"
description = "Local task and anonymous submission archive validation; execution disabled"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Keresztes Zsolt" }]
dependencies = [
    "fastapi==0.143.3",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "python-multipart==0.0.32",
    "streamlit==1.66.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contest_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]
worker = [
    "pydantic==2.14.1",
]
